name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      # Temporary: let each platform finish so its diagnostics are retained.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth

      - name: Build and check with Gradle (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew check coverage

      - name: Build and check with Gradle (Windows/macOS)
        if: runner.os != 'Linux'
        run: ./gradlew check coverage

      # Temporary Windows scrolling investigation; remove after the issue is resolved.
      - name: Upload temporary UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: temporary-ui-diagnostics-${{ runner.os }}-${{ github.run_attempt }}
          path: |
            build/ui-diagnostics/
            build/test-results/test/
            build/reports/tests/test/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
